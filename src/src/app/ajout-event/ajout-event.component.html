    <h1>Creer votre nouvelle evenement</h1>
    <form #f="ngForm" (ngSubmit)="ajouter()">
        <label>Titre :</label>
            <input type="text" [(ngModel)]="titre" name="titre" required><br>
        <label>Description :</label>
            <input type="text" [(ngModel)]="descriptions" name="descriptions" required><br>
        <label>Date Evenement :</label>
            <input type="date" [(ngModel)]="date_E" name="date_E" required><br>
        <label>Lieu :</label>
            <input type="lieu" [(ngModel)]="lieu" name="lieu" required> <br>
        <label>Prix de Billets :</label>
            <input type="number" [(ngModel)]="prix_Billet" name="prix_Billet" required> <br>
        <label>Image :</label>
            <input type="text" [(ngModel)]="image" name="image" required> <br>
        <label>Choisir une categorie :</label>
        <select [(ngModel)]="codeC" name="codeC">
            <option *ngFor="let c of cat" [value]="c.codeC">{{ c.nomCat }}</option>
        </select><br>
        <button type="submit">💾 Enregistrer</button>
    </form>
