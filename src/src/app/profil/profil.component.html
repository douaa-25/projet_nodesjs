<h2>Editer Profil</h2>
    <label>Nom : </label><input [(ngModel)]="compte.nom">&nbsp;<br>
    <label>Prenom : </label><input [(ngModel)]="compte.prenom">&nbsp;<br>
    <label>Adresse email : </label><input [(ngModel)]="compte.email">&nbsp;<br>
    <h3>Modifier votre mot de passe</h3><br>
    <label>Nouveau mot de passe :</label><input [(ngModel)]="nvPassword"><br>
    <label>Confirmer mot de passe :</label><input [(ngModel)]="cfPassword"><br>
    <button (click)="Enregistrer()">💾 Enregistrer</button>
